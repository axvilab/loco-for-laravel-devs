  title: Models in Sea-ORM
  slug: models-in-sea-orm
  body: |
    Sea-ORM splits Eloquent's `Post` into three types: `Model`, `ActiveModel` and `Entity`.

    | Eloquent | Sea-ORM |
    |---|---|
    | `$post` | `posts::Model` |
    | `$post->save()` | `ActiveModel::save` |
