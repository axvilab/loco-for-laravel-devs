{% extends "layouts/base.html" %}

{% block title %}{{ post.title }} · Loco Blog{% endblock title %}

{% block content %}
<article class="post">
  <header>
    <h1>{{ post.title }}</h1>
    <time datetime="{{ post.published_iso }}">{{ post.published_on }}</time>
  </header>
  <div class="post-body">
    {{ post.body_html | safe }}
  </div>
</article>
<p><a href="/">&larr; All posts</a></p>
{% endblock content %}
