{% if pagination.total_pages > 1 %}
<nav class="pagination" aria-label="Pagination">
  {% if pagination.prev_url %}<a rel="prev" href="{{ pagination.prev_url }}">&larr; Newer</a>{% else %}<span></span>{% endif %}
  <span class="page-info">Page {{ pagination.page }} of {{ pagination.total_pages }}</span>
  {% if pagination.next_url %}<a rel="next" href="{{ pagination.next_url }}">Older &rarr;</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
