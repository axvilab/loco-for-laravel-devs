<?xml version="1.0" encoding="UTF-8"?>
<rss version="2.0" xmlns:atom="http://www.w3.org/2005/Atom">
  <channel>
    <title>Loco Blog</title>
    <link>{{ base_url }}/</link>
    <description>A blog built with Loco, the Rails-like framework for Rust.</description>
    <language>en</language>
    <atom:link href="{{ base_url }}/feed.xml" rel="self" type="application/rss+xml"/>
    {% if last_build %}<lastBuildDate>{{ last_build }}</lastBuildDate>{% endif %}
    {% for item in items %}
    <item>
      <title>{{ item.title }}</title>
      <link>{{ item.url }}</link>
      <guid isPermaLink="true">{{ item.url }}</guid>
      <pubDate>{{ item.pub_date }}</pubDate>
      <description>{{ item.description_html }}</description>
    </item>
    {% endfor %}
  </channel>
</rss>
